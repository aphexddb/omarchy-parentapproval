# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: parentapproval

before:
  hooks:
    # Second arg is .IsSnapshot; snapshots must not rewrite VERSION/PKGBUILD.
    - ./scripts/stamp-version {{ .Version }} {{ .IsSnapshot }}

builds:
  - id: parentapproval
    main: ./cmd/parentapproval
    binary: parentapproval
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

  - id: parentapproval-relay
    main: ./cmd/parentapproval-relay
    binary: parentapproval-relay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: parentapproval
    ids:
      - parentapproval
    formats:
      - tar.gz
    name_template: "parentapproval_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

  - id: parentapproval-relay
    ids:
      - parentapproval-relay
    formats:
      - tar.gz
    name_template: "parentapproval-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  prerelease: auto
