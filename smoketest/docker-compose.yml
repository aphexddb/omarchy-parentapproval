services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    image: parentapproval-relay:smoke
    environment:
      PORT: "8080"
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-http://127.0.0.1:18080}
      RELAY_DATA: /data
    tmpfs:
      - /data:mode=0700
    ports:
      - "127.0.0.1:${HOST_PORT:-18080}:8080"
